<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGWEN — كتيّب المخيمات الرقمي</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo, useCallback, useEffect, useRef } = React;

        /* ================================================================
           SGWEN — كتيّب المخيمات الرقمي / Digital Camp Booklet
           Scouts & Guides Wadi El Nil
           ================================================================ */

        const C = {
          orange: "#F7941E", orangeDk: "#ED7117", orangeSoft: "#FCEBD6",
          ink: "#46464B", head: "#404044", paper: "#FFFFFF", line: "#EAE5DD",
          muted: "#9A958C", ok: "#3FA66A", bad: "#D9534F", warn: "#E0922F", credit: "#8A857C",
        };

        const uid = () => Math.random().toString(36).slice(2, 9);
        const fmt = (n) => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("en-EG");
        const diffMins = (a, b) => { const p = (t) => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); }; let d = p(b) - p(a); if (d < 0) d += 1440; return d; };
        function ageFromDOB(dob) { if (!dob) return ""; const d = new Date(dob); if (isNaN(d)) return ""; const now = new Date(); let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth()); if (now.getDate() < d.getDate()) m -= 1; if (m < 0) return ""; return (m / 12).toFixed(1); }

        const STR = {
          appTitle: ["كتيّب المخيمات", "Camp Booklet"],
          org: ["كشافة و مرشدات وادي النيل — هيئة التدريب", "Scouts & Guides Wadi El Nil — Training Authority"],
          exportPdf: ["تصدير PDF", "Export PDF"],
          saved: ["محفوظ تلقائيًا ✓", "Auto-saved ✓"],
          saveFile: ["حفظ ملف", "Save file"],
          loadFile: ["فتح ملف", "Load file"],
          newCamp: ["مخيم جديد", "New camp"],
          addRow: ["+ صف جديد", "+ Add row"],
          days: ["الأيام", "Days"],
          def: ["التعريف", "Definition"], site: ["بيانات أرض المخيم", "Site Data"],
          sitemap: ["رسم الأرض و المنشآت", "Site Map"], database: ["قاعدة البيانات", "Database (Roster)"],
          objectives: ["الأهداف", "Objectives"], program: ["برنامج المخيم", "Camp Program"],
          food: ["برنامج الأكل", "Meal Program"], gear: ["العتاد", "Gear"],
          firstaid: ["الإسعافات و الأمان", "First-Aid & Safety"], budget: ["الميزانية", "Budget"],
          vision: ["التصور العام", "General Vision"], discuss: ["المناقشات و الاعتماد", "Discussion & Approval"],
          permits: ["تصاريح", "Permits"], expenses: ["المصروفات", "Expenses"], evalS: ["تقييم المخيم", "Camp Evaluation"],
        };

        const GEAR_DEFAULT = () => ({
          "معدات القداس الإلهي": ["ملابس كاهن", "لوازم الهيكل", "كتب مقدسة - كتب ترانيم"],
          "معدات النظافة": ["أواني للغسيل والشطف", "صابون سائل أو بودرة", "لوف – سلك", "مقص وقاطع حاد"],
          "معدات المبيت": ["خيمة كاملة بالفراش والصواري والأوتاد", "دقماق", "حبال", "عصي للمنشآت", "مظلة قماش", "كشاف إضاءة"],
          "معدات الطبخ": ["حلة", "طاسة", "صينية", "مصفاة", "مغرفة", "بوتاجاز و أنبوبة", "شوال خشب", "صفيحة توضع تحت النار", "كبريت", "فتاحة معلبات", "شاش لتغطية الطعام", "جيركن جاز", "بلطة"],
          "الأعلام": ["علم الجمهورية", "علم الاتحاد العام للكشافة", "علم فتيان الكشافة / المرشدات", "علم وادي النيل", "علم المجموعة", "علم القائد العام", "لوازم الصاري (عصي – حبال)", "بكرة", "الطوطم"],
          "معدات أخرى": ["بروجي", "بوصلة", "خريطة للمكان", "بروجكتور – كمبيوتر", "ورق مقوى - أقلام", "دعاوي لحفل السمر", "تذكار أو هدايا", "مواد لاصقة", "دبابيس رسم", "إبر خياطة", "آلة تصوير", "Markers + Whiteboard", "بطارية جافة", "قماش لعصا حارس النار", "منبه"],
        });
        const FIRSTAID_DEFAULT = () => ["بيتادين", "شاش", "شاش فازلين", "قطن", "Alcohol Swab (ماسح كحول)", "مقص", "ملقط", "بلاستر بكرة", "بلاستر عادي", "بلاستر waterproof", "رباط ضاغط", "ترمومتر", "جوانتي طبي", "Burnazin للحروق", "Hemoclar للكدمات والالتواءات", "Fucicort مضاد حيوي", "Kenacomb للتسلخات", "Ventolin بخاخة", "كمادات جل"];

        const BUDGET_LINES = [
          ["activities", "التكلفة المتوقعة للفقرات", "Activities cost"],
          ["food", "التكلفة المتوقعة للأكل", "Food cost"],
          ["gear", "التكلفة المتوقعة للعتاد", "Gear cost"],
          ["firstaid", "التكلفة المتوقعة للإسعافات و الأمان", "First-aid & safety cost"],
          ["prepTransport", "انتقالات إعداد المخيم", "Prep transport"],
          ["roundTransport", "انتقالات المخيمين (ذهاب وإياب)", "Campers transport (round)"],
          ["duringTransport", "انتقالات أثناء المخيم", "On-site transport"],
          ["venue", "حجز أرض المخيم", "Venue booking"],
          ["petty", "نثريات", "Petty"],
          ["other", "مصروفات أخرى", "Other"],
        ];
        const DB_PRELANE = [["kader", "الكادر", "Cadre"], ["afrad", "أفراد", "Members"]];
        const ACT_TYPES = [["deeni", "ديني", "Spiritual", "#7C5CBF"], ["kashfi", "كشفي", "Scouting", "#2F8FB3"], ["tarfihi", "ترفيهي", "Recreational", "#F7941E"], ["thaqafi", "ثقافي", "Cultural", "#C2603C"], ["ibdaai", "إبداعي", "Creative", "#3FA66A"], ["riyadi", "رياضي", "Physical", "#D9534F"]];
        const MEAL_SLOTS = [["breakfast", "وجبة الإفطار", "Breakfast"], ["snack1", "وجبة خفيفة", "Light snack"], ["lunch", "وجبة الغداء", "Lunch"], ["snack2", "وجبة خفيفة", "Light snack"], ["dinner", "وجبة العشاء", "Dinner"]];
        const APPROVAL_CHAIN = [["unit", "قائد/ة الوحدة", "Unit Leader"], ["groupSafety", "مسؤول الأمان بالمجموعة", "Group Safety Officer"], ["group", "قائد/ة المجموعة", "Group Leader"], ["division", "قائد/ة الشعبة", "Division Leader"], ["region", "قائد/ة المنطقة", "Region Leader"], ["training", "قائد/ة التدريب", "Training Leader"], ["general", "القائد العام", "General Leader"]];
        const SECTIONS = [["def", "def", "١"], ["site", "site", "٢"], ["sitemap", "sitemap", "٣"], ["database", "database", "٤"], ["objectives", "objectives", "٥"], ["program", "program", "٦"], ["food", "food", "٧"], ["gear", "gear", "٨"], ["firstaid", "firstaid", "٩"], ["budget", "budget", "١٠"], ["vision", "vision", "١١"], ["discuss", "discuss", "١٢"], ["permits", "permits", "١٣"], ["expenses", "expenses", "١٤"], ["evalS", "evalS", "١٥"]];

        const inp = { width: "100%", padding: "6px 10px", border: `1px solid ${C.line}`, borderRadius: 8, background: "#fff", fontFamily: "inherit", color: C.ink, outline: "none", boxSizing: "border-box" };
        const tbl = { width: "100%", borderCollapse: "collapse", fontSize: 13.5 };

        function blankCamp() {
          return {
            meta: { campName: "", unit: "", group: "VII", isOneDay: false, dateFrom: "", dateTo: "", days: 4, headcountOverride: "" },
            def: { type: "", explainTheme: "", scoring: "" },
            site: { address: "", contactName: "", contactPhone: "", description: "", difficulties: "", transport: "", service: "", souq: "", bakery: "", pharmacy: "", hospital: "", police: "", fire: "", mobile: true },
            sitemap: { land: "", structures: "", other: "" },
            db: [],
            objectives: { prevNotes: "", rows: [{ id: uid(), goal: "", explain: "", means: "", measure: "" }], explainGoals: "", means: "" },
            program: {},
            food: {},
            gear: (() => { const g = {}; Object.entries(GEAR_DEFAULT()).forEach(([cat, items]) => { g[cat] = items.map((n) => ({ id: uid(), name: n, qty: "", buy: false, check: false })); }); return g; })(),
            firstaid: FIRSTAID_DEFAULT().map((n) => ({ id: uid(), name: n, qty: "", buy: false, check: false })),
            budget: { activities: "", food: "", gear: "", firstaid: "", prepTransport: "", roundTransport: "", duringTransport: "", venue: "", petty: "", other: "", emergency: "" },
            discuss: {},
            supreme: { name: "", title: "", signed: "", date: "", note: "" },
            permitsNotes: "",
            expenses: [{ id: uid(), date: "", item: "", amount: "" }],
            evalNotes: { programChange: "", budgetChange: "", transport: "", incidents: "", goalScore: "", siteScore: "", security: "", positives: "", negatives: "", other: "" },
          };
        }

        /* ===== SGWEN Ankh logo (orange, from the official booklet) ===== */
        function Logo({ size = 40 }) {
          return (
            <div style={{ width: size, height: size, borderRadius: 11, background: `linear-gradient(135deg,${C.orange},${C.orangeDk})`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: "0 5px 14px rgba(237,113,23,.32)" }}>
              <svg viewBox="0 0 40 56" width={size * 0.56} height={size * 0.78} fill="none" stroke="#fff" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round">
                {/* ankh loop */}
                <ellipse cx="20" cy="14" rx="11" ry="13" />
                {/* vertical stem */}
                <line x1="20" y1="27" x2="20" y2="52" />
                {/* cross bar */}
                <line x1="6" y1="34" x2="34" y2="34" />
              </svg>
            </div>
          );
        }
        function Card({children}) { return <div className="pcard" style={{background:C.paper, border:`1px solid ${C.line}`, borderRadius:16, padding:20, boxShadow:"0 2px 8px rgba(0,0,0,0.03)"}}>{children}</div>; }
        function SectionHead({num, title, sub}) { return <div style={{borderBottom:`2px solid ${C.orange}`, paddingBottom:10, marginBottom:16}}> <div style={{fontSize:22, fontWeight:900, color:C.orange, lineHeight:1}}>{num}</div> <h2 style={{fontSize:22, fontWeight:900, color:C.head, margin:"2px 0 0"}}>{title}</h2> {sub && <p style={{fontSize:12.5, color:C.muted, margin:"4px 0 0"}}>{sub}</p>} </div>; }
        function Field({label, value, onChange, placeholder, area, type="text"}) { return <div style={{marginBottom:12, width:"100%", flex:"1 1 auto", minWidth:0}}> <label style={{display:"block", fontSize:12.5, fontWeight:700, color:C.head, marginBottom:4}}>{label}</label> {area ? <textarea rows={area} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{...inp, resize:"vertical"}}/> : <input type={type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={inp}/>} </div>; }
        function Row({children}) { return <div style={{display:"flex", gap:12, flexWrap:"wrap"}}>{children}</div>; }
        function Th({children, w}) { return <th style={{background:C.orange, color:"#fff", padding:"8px 10px", textAlign:"start", fontSize:12, fontWeight:800, width:w, whiteSpace:"nowrap"}}>{children}</th>; }
        function Td({children, colSpan, w}) { return <td colSpan={colSpan} style={{borderBottom:`1px solid ${C.line}`, padding:4, width:w, verticalAlign:"top"}}>{children}</td>; }
        function CellInput({v, on, type="text", placeholder}) { return <input type={type} value={v||""} placeholder={placeholder} onChange={e=>on(e.target.value)} style={{width:"100%", border:"1px solid transparent", background:"transparent", padding:"6px 7px", borderRadius:7, fontFamily:"inherit", color:C.ink, outline:"none", fontSize:13, boxSizing:"border-box"}} onFocus={e=>e.target.style.background="#FFF8EF"} onBlur={e=>e.target.style.background="transparent"}/>; }
        function DelBtn({onClick}) { return <button onClick={onClick} style={{border:"none", background:"transparent", color:"#CBB", cursor:"pointer", fontSize:16, fontWeight:800, padding:"4px 8px"}}>×</button>; }
        function Btn({children, kind, small, onClick}) {
          let bg=C.orange, co="#fff", bo="none";
          if(kind==="line") { bg="transparent"; co=C.muted; bo=`1px solid ${C.line}`; }
          if(kind==="ghost") { bg=C.orangeSoft; co=C.orangeDk; }
          if(kind==="dk") { bg=C.orangeDk; co="#fff"; }
          if(kind==="danger") { bg="#FBE8E7"; co=C.bad; }
          return <button onClick={onClick} style={{border:bo, background:bg, color:co, borderRadius:8, cursor:"pointer", padding:small?"6px 12px":"8px 18px", fontSize:small?12.5:14, fontWeight:800, fontFamily:"inherit"}}>{children}</button>;
        }
        function MetaInput({label, v, on, type="text", w}) { return <label style={{flex: w ? `0 0 ${w}px` : "1 1 160px", minWidth:0}}> <div style={{fontSize:11, color:C.muted, fontWeight:700, marginBottom:3}}>{label}</div> <input type={type} value={v||""} onChange={e=>on(e.target.value)} style={{...inp, padding:"7px 10px", fontSize:13}}/> </label>; }
        function Inline({v, on, ph, w}) { return <input type="text" value={v||""} onChange={e=>on(e.target.value)} placeholder={ph} style={{width:w, border:"none", borderBottom:`1.5px solid ${C.orange}`, background:"transparent", padding:"3px 6px", fontSize:13.5, color:C.head, fontWeight:700, outline:"none", fontFamily:"inherit", margin:"0 4px"}}/>; }
        function Stat({label, value, accent}) { return <div style={{flex:"1 1 160px", background:accent?`linear-gradient(135deg,${C.orange},${C.orangeDk})`:"#FFFDFB", border:`1px solid ${accent?"transparent":C.line}`, borderRadius:12, padding:14}}><div style={{fontSize:11.5, fontWeight:800, color:accent?"rgba(255,255,255,.85)":C.muted}}>{label}</div><div style={{fontSize:21, fontWeight:900, color:accent?"#fff":C.head, marginTop:2}}>{value}</div></div>; }
        function Check({v, on}) { return <div style={{textAlign:"center"}}><input type="checkbox" checked={!!v} onChange={e=>on(e.target.checked)} style={{width:18, height:18, accentColor:C.orange, cursor:"pointer"}}/></div>; }

        function DefSection({ camp, set, rtl }) {
          return (<Card><SectionHead num="١" title={rtl ? "التعريف" : "Definition"} sub={rtl ? "نوع المخيم و فكرته العامة" : "Camp type & general idea"} />
            <Field label={rtl ? "هذا المخيم هو مخيم..." : "This camp is a..."} value={camp.def.type} onChange={(x) => set("def.type", x)} placeholder={rtl ? "مخيم مجموعة / وحدة / تدريب ..." : "group / unit / training camp ..."} />
            <Field label={rtl ? "شرح فكرة المخيم العامة (Theme)" : "General theme / idea"} value={camp.def.explainTheme} onChange={(x) => set("def.explainTheme", x)} area={4} />
            <Field label={rtl ? "نظام النقاط (Scoring System)" : "Scoring system"} value={camp.def.scoring} onChange={(x) => set("def.scoring", x)} area={3} />
          </Card>);
        }

        function SiteSection({ camp, set, rtl }) {
          const v = camp.site;
          const near = [["souq", "أقرب سوق", "Nearest market"], ["bakery", "أقرب مخبز", "Nearest bakery"], ["pharmacy", "أقرب صيدلية", "Nearest pharmacy"], ["hospital", "أقرب مستشفى", "Nearest hospital"], ["police", "أقرب قسم شرطة", "Nearest police"], ["fire", "أقرب مطافئ", "Nearest fire"]];
          return (<Card><SectionHead num="٢" title={rtl ? "بيانات عن مكان التخييم" : "Camp Site Data"} />
            <Field label={rtl ? "العنوان" : "Address"} value={v.address} onChange={(x) => set("site.address", x)} />
            <Row><Field label={rtl ? "المسؤول عن المكان" : "Site contact"} value={v.contactName} onChange={(x) => set("site.contactName", x)} /><Field label={rtl ? "تليفون المسؤول" : "Contact phone"} value={v.contactPhone} onChange={(x) => set("site.contactPhone", x)} /></Row>
            <Field label={rtl ? "وصف المكان (نوع الأرض/الاتساع/سهولة المعيشة)" : "Site description"} value={v.description} onChange={(x) => set("site.description", x)} area={3} />
            <Field label={rtl ? "الصعوبات" : "Difficulties"} value={v.difficulties} onChange={(x) => set("site.difficulties", x)} area={2} />
            <Field label={rtl ? "طريقة الانتقال" : "Transport method"} value={v.transport} onChange={(x) => set("site.transport", x)} area={2} />
            <Field label={rtl ? "الخدمة التي يمكن تقديمها أثناء المخيم" : "Service possible during camp"} value={v.service} onChange={(x) => set("site.service", x)} />
            <div style={{ fontWeight: 800, color: C.head, margin: "8px 0 6px" }}>{rtl ? "عناوين و أرقام مفيدة" : "Useful addresses & numbers"}</div>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>{near.map(([k, ar, en]) => <div key={k} style={{ flex: "1 1 210px" }}><Field label={rtl ? ar : en} value={v[k]} onChange={(x) => set(`site.${k}`, x)} placeholder={rtl ? "المكان — الزمن" : "place — time"} /></div>)}</div>
            <label style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><input type="checkbox" checked={!!v.mobile} onChange={(e) => set("site.mobile", e.target.checked)} style={{ width: 18, height: 18, accentColor: C.orange }} />{rtl ? "المكان مغطى بشبكات المحمول" : "Site has mobile coverage"}</label>
          </Card>);
        }

        function SiteMapSection({ camp, set, rtl }) {
          return (<Card><SectionHead num="٣" title={rtl ? "رسم الأرض و المنشآت" : "Site Map & Structures"} sub={rtl ? "صِف أو الصق روابط صور الرسومات" : "Describe or paste image links"} />
            <Field label={rtl ? "رسومات أرض المخيم" : "Camp land drawings"} value={camp.sitemap.land} onChange={(x) => set("sitemap.land", x)} area={3} placeholder={rtl ? "وصف / رابط صورة" : "description / image link"} />
            <Field label={rtl ? "رسومات المنشآت" : "Structures drawings"} value={camp.sitemap.structures} onChange={(x) => set("sitemap.structures", x)} area={3} />
            <Field label={rtl ? "رسومات / خرائط أخرى" : "Other drawings / maps"} value={camp.sitemap.other} onChange={(x) => set("sitemap.other", x)} area={3} />
          </Card>);
        }

        function DatabaseSection({ camp, set, rtl, autoHead }) {
          const rows = camp.db;
          const add = (lane) => set("db", [...rows, { id: uid(), lane, rank: "", name: "", dob: "", nid: "", blood: "", address: "", phone: "", health: "", landline: "", father: "", fatherPhone: "", mother: "", motherPhone: "" }]);
          const setRow = (id, f, v) => set("db", rows.map((r) => r.id === id ? { ...r, [f]: v } : r));
          const del = (id) => set("db", rows.filter((r) => r.id !== id));
          return (<Card><SectionHead num="٤" title={rtl ? "قاعدة البيانات — القادة و الأفراد" : "Database — Leaders & Members"} sub={rtl ? `العدد محسوب تلقائيًا = ${autoHead} · السن يُحسب من تاريخ الميلاد` : `Headcount auto = ${autoHead} · age auto from DOB`} />
            {DB_PRELANE.map(([lane, ar, en]) => { const laneRows = rows.filter((r) => r.lane === lane); return (
              <div key={lane} style={{ marginBottom: 18 }}>
                <div style={{ background: C.orange, color: "#fff", fontWeight: 800, padding: "7px 12px", borderRadius: "9px 9px 0 0" }}>{rtl ? ar : en} <span style={{ opacity: .8, fontWeight: 600 }}>({laneRows.length})</span></div>
                <div style={{ overflowX: "auto", border: `1px solid ${C.line}`, borderTop: "none", borderRadius: "0 0 9px 9px" }}>
                  <table style={{ ...tbl, minWidth: 1200 }}><thead><tr>
                    <Th w={90}>{rtl ? "الرتبة" : "Rank"}</Th><Th w={150}>{rtl ? "الاسم رباعي" : "Full name"}</Th><Th w={120}>{rtl ? "تاريخ الميلاد" : "DOB"}</Th><Th w={60}>{rtl ? "السن" : "Age"}</Th><Th w={140}>{rtl ? "الرقم القومي" : "National ID"}</Th><Th w={70}>{rtl ? "الدم" : "Blood"}</Th><Th w={150}>{rtl ? "العنوان" : "Address"}</Th><Th w={110}>{rtl ? "المحمول" : "Mobile"}</Th><Th w={120}>{rtl ? "الحالة الصحية" : "Health"}</Th><Th w={110}>{rtl ? "اسم الأب" : "Father"}</Th><Th w={110}>{rtl ? "محمول الأب" : "Father ph."}</Th><Th w={110}>{rtl ? "اسم الأم" : "Mother"}</Th><Th w={110}>{rtl ? "محمول الأم" : "Mother ph."}</Th><Th w={34}></Th>
                  </tr></thead><tbody>
                    {laneRows.length === 0 && <tr><Td colSpan={14}><span style={{ color: C.muted, fontSize: 12 }}>{rtl ? "فارغ — أضف صفًا" : "Empty — add a row"}</span></Td></tr>}
                    {laneRows.map((r) => <tr key={r.id}>
                      <Td w={90}><CellInput v={r.rank} on={(x) => setRow(r.id, "rank", x)} /></Td>
                      <Td w={150}><CellInput v={r.name} on={(x) => setRow(r.id, "name", x)} /></Td>
                      <Td w={120}><CellInput type="date" v={r.dob} on={(x) => setRow(r.id, "dob", x)} /></Td>
                      <Td w={60}><span style={{ fontSize: 13, fontWeight: 800, color: C.orangeDk, padding: "0 6px" }}>{ageFromDOB(r.dob) || "—"}</span></Td>
                      <Td w={140}><CellInput v={r.nid} on={(x) => setRow(r.id, "nid", x)} /></Td>
                      <Td w={70}><CellInput v={r.blood} on={(x) => setRow(r.id, "blood", x)} /></Td>
                      <Td w={150}><CellInput v={r.address} on={(x) => setRow(r.id, "address", x)} /></Td>
                      <Td w={110}><CellInput v={r.phone} on={(x) => setRow(r.id, "phone", x)} /></Td>
                      <Td w={120}><CellInput v={r.health} on={(x) => setRow(r.id, "health", x)} /></Td>

            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {APPROVAL_CHAIN.map(([k, ar, en], i) => { const a = get(k); const dec = decisions.find((d) => d[0] === a.decision); return (
                <div key={k} style={{ border: `1px solid ${dec ? dec[2] : C.line}`, borderRadius: 14, padding: 14, background: dec ? `${dec[2]}0D` : "#FFFDFB" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}><span style={{ width: 26, height: 26, borderRadius: "50%", background: C.orange, color: "#fff", fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>{i + 1}</span><b style={{ color: C.head, fontSize: 15 }}>{rtl ? ar : en}</b>{dec && <span style={{ marginInlineStart: "auto", color: dec[2], fontWeight: 800, fontSize: 13 }}>{dec[1]} · {a.ts}</span>}</div>
                  <textarea value={a.note} onChange={(e) => upd(k, "note", e.target.value)} rows={2} placeholder={rtl ? "ملاحظات / مناقشة..." : "Notes / discussion..."} style={{ ...inp, marginBottom: 10, resize: "vertical" }} />
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                    <input value={a.name} onChange={(e) => upd(k, "name", e.target.value)} placeholder={rtl ? "اسم المعتمِد" : "Approver name"} style={{ ...inp, flex: "1 1 150px", padding: "8px 11px" }} />
                    <input value={a.signed} onChange={(e) => upd(k, "signed", e.target.value)} placeholder={rtl ? "توقيع رقمي" : "Digital sign"} style={{ ...inp, flex: "1 1 150px", padding: "8px 11px" }} />
                    <div style={{ display: "flex", gap: 6 }}>{decisions.map(([dk, dl, dc]) => <button key={dk} onClick={() => upd(k, "decision", dk)} style={{ cursor: "pointer", border: `1.5px solid ${dc}`, borderRadius: 8, fontWeight: 800, fontSize: 12, padding: "7px 11px", fontFamily: "inherit", background: a.decision === dk ? dc : "transparent", color: a.decision === dk ? "#fff" : dc }}>{dl}</button>)}</div>
                  </div>
                </div>
              ); })}
            </div>
            <div style={{ marginTop: 20, border: `2px solid ${C.orange}`, borderRadius: 16, padding: 18, background: C.orangeSoft }}>
              <h3 style={{ margin: "0 0 4px", color: C.orangeDk, fontWeight: 900, fontSize: 17 }}>{rtl ? "الاعتماد النهائي — القائد الأعلى" : "Final Sign-off — Supreme Leader"}</h3>
              <p style={{ margin: "0 0 12px", fontSize: 12.5, color: C.ink }}>{rtl ? "توقيع قائد القادة المعتمد لإقرار المخيم نهائيًا" : "The leaders-of-leaders signature granting final approval"}</p>
              <Row><Field label={rtl ? "الاسم" : "Name"} value={sup.name} onChange={(x) => set("supreme.name", x)} /><Field label={rtl ? "الصفة" : "Title"} value={sup.title} onChange={(x) => set("supreme.title", x)} /></Row>
              <Row><Field label={rtl ? "التوقيع الرقمي (اعتماد)" : "Digital signature"} value={sup.signed} onChange={(x) => set("supreme.signed", x)} /><Field label={rtl ? "التاريخ" : "Date"} type="date" value={sup.date} onChange={(x) => set("supreme.date", x)} /></Row>
              <Field label={rtl ? "ملاحظة نهائية (اختياري)" : "Final note (optional)"} value={sup.note} onChange={(x) => set("supreme.note", x)} area={2} />
            </div>
          </Card>);
        }

        function PermitsSection({ camp, rtl }) {
          const m = camp.meta; const leaderRow = camp.db.find((r) => r.lane === "kader" && r.name); const leader = leaderRow ? leaderRow.name : "____";
          const letters = [[rtl ? "إلى من يهمه الأمر" : "To Whom It May Concern", rtl ? "إخطار عام" : "General notice"], [rtl ? "تصريح بإقامة المخيم" : "Camp Establishment Permit", rtl ? "معتمد من القائد العام" : "Approved by General Leader"], [rtl ? "خطاب مأمور القسم" : "Letter to Police Precinct", rtl ? "إخطار أمني" : "Security notice"]];
          return (<Card><SectionHead num="١٣" title={rtl ? "التصاريح الرسمية" : "Official Permits"} sub={rtl ? "تُملأ تلقائيًا — جاهزة للطباعة و الختم" : "Auto-filled — ready to print & stamp"} />
            {letters.map(([t, w], i) => <div key={i} style={{ border: `1px solid ${C.line}`, borderRadius: 14, padding: 18, marginBottom: 14, background: "#FFFDFB" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}><h3 style={{ margin: 0, color: C.orangeDk, fontWeight: 900, fontSize: 18 }}>{t}</h3><Logo size={34} /></div>
              <p style={{ color: C.muted, fontSize: 12.5, margin: "4px 0 12px" }}>{w}</p>
              <div style={{ lineHeight: 2, fontSize: 14.5 }}>{rtl ? "تقوم مجموعات كشافة و مرشدات وادي النيل بمخيم " : "Wadi El Nil Scouts & Guides will hold camp "}<b>{m.campName || "____"}</b>{rtl ? " بمكان " : " at "}<b>{camp.site.address || "____"}</b>{rtl ? " في الفترة من " : " from "}<b>{m.dateFrom || "__/__/____"}</b>{rtl ? " حتى " : " to "}<b>{m.dateTo || "__/__/____"}</b>{rtl ? "، تحت قيادة " : ", led by "}<b>{leader}</b>{rtl ? "، بعدد " : ", with "}<b>{m.headcountOverride || camp.db.filter((r) => r.name).length || "__"}</b>{rtl ? " فردًا." : " members."}</div>
              <div style={{ marginTop: 16 }}><div style={{ fontWeight: 800, color: C.head }}>{rtl ? "قائد عام — كشافة و مرشدات وادي النيل" : "General Leader — Scouts & Guides Wadi El Nil"}</div><div style={{ marginTop: 8, borderTop: `1px solid ${C.line}`, width: 220, paddingTop: 4, fontSize: 12, color: C.muted }}>{rtl ? "التوقيع و الختم" : "Signature & stamp"}</div></div>
            </div>)}
          </Card>);
        }

        function ExpensesSection({ camp, set, rtl }) {
          const rows = camp.expenses; const total = rows.reduce((a, r) => a + (Number(r.amount) || 0), 0);
          const setRow = (id, f, v) => set("expenses", rows.map((r) => r.id === id ? { ...r, [f]: v } : r));
          return (<Card><SectionHead num="١٤" title={rtl ? "تقرير مصروفات أمانة الصندوق" : "Treasury Expense Report"} />
            <div style={{ overflowX: "auto" }}><table style={tbl}><thead><tr><Th w={150}>{rtl ? "التاريخ" : "Date"}</Th><Th>{rtl ? "البند" : "Item"}</Th><Th w={140}>{rtl ? "القيمة" : "Amount"}</Th><Th w={34}></Th></tr></thead>
              <tbody>{rows.map((r) => <tr key={r.id}><Td w={150}><CellInput type="date" v={r.date} on={(x) => setRow(r.id, "date", x)} /></Td><Td><CellInput v={r.item} on={(x) => setRow(r.id, "item", x)} /></Td><Td w={140}><CellInput type="number" v={r.amount} on={(x) => setRow(r.id, "amount", x)} /></Td><Td w={34}><DelBtn onClick={() => set("expenses", rows.filter((x) => x.id !== r.id))} /></Td></tr>)}
                <tr style={{ background: C.orangeSoft }}><Td colSpan={2}><b style={{ color: C.orangeDk }}>{rtl ? "الإجمالي" : "Total"}</b></Td><Td><b>{fmt(total)}</b></Td><Td /></tr></tbody></table></div>
            <div style={{ marginTop: 8 }}><Btn kind="ghost" small onClick={() => set("expenses", [...rows, { id: uid(), date: "", item: "", amount: "" }])}>{rtl ? "+ مصروف" : "+ Expense"}</Btn></div>
          </Card>);
        }

        function EvalSection({ camp, set, rtl }) {
          const e = camp.evalNotes;
          const f = [["programChange", "هل عُدّل البرنامج؟ لماذا؟", "Program changes?", 2], ["budgetChange", "هل عُدّلت الميزانية؟ لماذا؟", "Budget changes?", 2], ["transport", "تعليق على المواصلات", "Transport comments", 2], ["incidents", "أي حوادث أو إصابات", "Incidents/injuries", 2], ["goalScore", "تقييم وصول الهدف (١–٥) + تعليق", "Goal score (1–5)", 2], ["siteScore", "تقييم جودة الأرض (١–٥) + تعليق", "Site quality (1–5)", 2], ["security", "تعليق على التصاريح / الأمن", "Permits/security", 2], ["positives", "أهم الإيجابيات", "Key positives", 3], ["negatives", "أهم السلبيات (لتجنبها)", "Key negatives", 3], ["other", "تعليقات أخرى", "Other comments", 2]];
          return (<Card><SectionHead num="١٥" title={rtl ? "تقييم المخيم" : "Camp Evaluation"} sub={rtl ? "يُملأ أثناء و بعد المخيم" : "Filled during & after"} />
            {f.map(([k, ar, en, r]) => <Field key={k} label={rtl ? ar : en} value={e[k]} onChange={(x) => set(`evalNotes.${k}`, x)} area={r} />)}
          </Card>);
        }

        function App() {
          const [lang, setLang] = useState("ar");
          const L = lang === "ar" ? 0 : 1;
          const rtl = lang === "ar";
          const s = (k) => STR[k][L];

          const [camp, setCamp] = useState(() => {
            try { const saved = localStorage.getItem("sgwen_camp_v2"); if (saved) return JSON.parse(saved); } catch (e) {}
            return blankCamp();
          });
          const [active, setActive] = useState("def");
          const [savedFlag, setSavedFlag] = useState(false);

          useEffect(() => {
            const t = setTimeout(() => { try { localStorage.setItem("sgwen_camp_v2", JSON.stringify(camp)); setSavedFlag(true); setTimeout(() => setSavedFlag(false), 1400); } catch (e) {} }, 600);
            return () => clearTimeout(t);
          }, [camp]);

          const set = useCallback((path, value) => {
            setCamp((c) => { const n = JSON.parse(JSON.stringify(c)); let o = n; const ks = path.split("."); for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = value; return n; });
          }, []);

          const days = camp.meta.isOneDay ? 1 : Math.max(1, Math.min(7, Number(camp.meta.days) || 1));
          const dayArr = Array.from({ length: days }, (_, i) => i + 1);

          const autoHead = useMemo(() => camp.db.filter((r) => (r.name || "").trim()).length, [camp.db]);
          const headcount = camp.meta.headcountOverride !== "" && camp.meta.headcountOverride != null ? Number(camp.meta.headcountOverride) || 0 : autoHead;

          const foodTotal = useMemo(() => { let t = 0; Object.values(camp.food || {}).forEach((slots) => Object.values(slots || {}).forEach((rows) => (rows || []).forEach((r) => (t += Number(r.cost) || 0)))); return t; }, [camp.food]);

          const budget = useMemo(() => {
            const n = (x) => Number(x) || 0; const b = camp.budget;
            const totalExpenses = BUDGET_LINES.reduce((a, [k]) => a + n(b[k]), 0);
            const perPerson = headcount > 0 ? totalExpenses / headcount : 0;
            return { totalExpenses, perPerson, emergency: n(b.emergency) };
          }, [camp.budget, headcount]);

          const vision = useMemo(() => {
            const perDay = {}; const totals = {}; ACT_TYPES.forEach(([k]) => (totals[k] = 0)); let grand = 0;
            dayArr.forEach((d) => {
              const dt = {}; ACT_TYPES.forEach(([k]) => (dt[k] = 0));
              ((camp.program[d] && camp.program[d].items) || []).forEach((it) => { if (it.from && it.to && it.type && dt[it.type] != null) { const m = diffMins(it.from, it.to); dt[it.type] += m; totals[it.type] += m; grand += m; } });
              perDay[d] = dt;
            });
            return { perDay, totals, grand };
          }, [camp.program, dayArr]);

          const exportPdf = () => window.print();
          const newCamp = () => { if (confirm(rtl ? "بدء مخيم جديد فارغ؟ سيُمحى الحالي." : "Start a new blank camp? Current one will be cleared.")) { setCamp(blankCamp()); setActive("def"); } };

          const saveFile = () => {
            const name = (camp.meta.campName || "camp").replace(/[^\w\u0600-\u06FF-]+/g, "_").slice(0, 40);
            const blob = new Blob([JSON.stringify(camp, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `SGWEN_${name}.json`; a.click();
            URL.revokeObjectURL(url);
          };

          const fileRef = useRef(null);
          const loadFile = (e) => {
            const file = e.target.files && e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const data = JSON.parse(reader.result);
                if (!data || !data.meta) throw new Error("bad");
                const merged = { ...blankCamp(), ...data, meta: { ...blankCamp().meta, ...(data.meta || {}) } };
                setCamp(merged); setActive("def");
              } catch (err) { alert(rtl ? "تعذّر قراءة الملف. تأكد أنه ملف حفظ (.json) صادر من هذا التطبيق." : "Couldn't read the file. Make sure it's a .json save exported from this app."); }
              finally { e.target.value = ""; }
            };
            reader.readAsText(file);
          };

          const ctx = { camp, set, setCamp, rtl, L, dayArr, headcount, autoHead, foodTotal, budget, vision };

          return (
            <div dir={rtl ? "rtl" : "ltr"} style={{ minHeight: "100vh", background: "#F4F1EC", color: C.ink, fontFamily: rtl ? "'Segoe UI','Tahoma',sans-serif" : "'Trebuchet MS','Segoe UI',sans-serif" }}>
              <style>{`
                *{box-sizing:border-box} ::placeholder{color:#C4BEB4}
                input:focus,textarea:focus,select:focus{border-color:${C.orange}!important;box-shadow:0 0 0 3px ${C.orangeSoft}}
                .navbtn:hover{background:${C.orangeSoft}}
                @media print{.no-print{display:none!important} body{background:#fff} .print-area{box-shadow:none!important;border:none!important;max-width:100%!important} .pcard{break-inside:avoid;border:1px solid #ddd!important;box-shadow:none!important;page-break-inside:avoid}}
              `}</style>

              <header className="no-print" style={{ background: C.paper, borderBottom: `1px solid ${C.line}`, position: "sticky", top: 0, zIndex: 30 }}>
                <div style={{ maxWidth: 1180, margin: "0 auto", padding: "12px 18px", display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
                  <Logo size={44} />
                  <div style={{ flex: 1, minWidth: 180 }}>
                    <div style={{ fontSize: 22, fontWeight: 800, color: C.head, lineHeight: 1.25 }}>{s("appTitle")}</div>
                    <div style={{ fontSize: 11.5, color: C.muted }}>{s("org")}</div>
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                    <div style={{ display: "flex", background: C.orangeSoft, borderRadius: 9, padding: 3 }}>{["ar", "en"].map((lg) => <button key={lg} onClick={() => setLang(lg)} style={{ border: "none", cursor: "pointer", fontWeight: 800, fontSize: 12.5, padding: "6px 12px", borderRadius: 7, fontFamily: "inherit", background: lang === lg ? C.orange : "transparent", color: lang === lg ? "#fff" : C.orangeDk }}>{lg === "ar" ? "عربي" : "EN"}</button>)}</div>
                    <span style={{ fontSize: 11.5, color: savedFlag ? C.ok : C.muted, fontWeight: 700, minWidth: 70 }}>{savedFlag ? s("saved") : ""}</span>
                    <Btn kind="line" small onClick={newCamp}>{s("newCamp")}</Btn>
                    <Btn kind="line" small onClick={() => fileRef.current && fileRef.current.click()}>{s("loadFile")}</Btn>
                    <Btn kind="ghost" small onClick={saveFile}>{s("saveFile")}</Btn>
                    <input ref={fileRef} type="file" accept="application/json,.json" onChange={loadFile} style={{ display: "none" }} />
                    <Btn kind="dk" small onClick={exportPdf}>{s("exportPdf")}</Btn>
                  </div>
                </div>
                <div style={{ maxWidth: 1180, margin: "0 auto", padding: "0 18px 12px", display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                  <MetaInput label={rtl ? "اسم المخيم" : "Camp name"} v={camp.meta.campName} on={(x) => set("meta.campName", x)} />
                  <MetaInput label={rtl ? "الوحدة" : "Unit"} v={camp.meta.unit} on={(x) => set("meta.unit", x)} w={110} />
                  <MetaInput label={rtl ? "من" : "From"} type="date" v={camp.meta.dateFrom} on={(x) => set("meta.dateFrom", x)} w={145} />
                  <MetaInput label={rtl ? "إلى" : "To"} type="date" v={camp.meta.dateTo} on={(x) => set("meta.dateTo", x)} w={145} />
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 700, color: C.ink, paddingBottom: 6 }}><input type="checkbox" checked={camp.meta.isOneDay} onChange={(e) => set("meta.isOneDay", e.target.checked)} style={{ accentColor: C.orange, width: 16, height: 16 }} />{rtl ? "رحلة يوم واحد" : "One-day"}</label>
                  {!camp.meta.isOneDay && <div style={{ minWidth: 140 }}><div style={{ fontSize: 11, color: C.muted, fontWeight: 700, marginBottom: 3 }}>{s("days")}: <b style={{ color: C.orangeDk }}>{days}</b></div><input type="range" min={1} max={7} value={days} onChange={(e) => set("meta.days", Number(e.target.value))} style={{ width: "100%", accentColor: C.orange }} /></div>}
                  <div style={{ minWidth: 160 }}><div style={{ fontSize: 11, color: C.muted, fontWeight: 700, marginBottom: 3 }}>{rtl ? "العدد (تلقائي:" : "Headcount (auto:"} <b style={{ color: C.orangeDk }}>{autoHead}</b>)</div><input type="number" value={camp.meta.headcountOverride} onChange={(e) => set("meta.headcountOverride", e.target.value)} placeholder={rtl ? `${autoHead} — تجاوز يدوي` : `${autoHead} — override`} style={{ ...inp, padding: "7px 10px", fontSize: 13 }} /></div>
                </div>
              </header>

              <div style={{ maxWidth: 1180, margin: "0 auto", padding: 18, display: "flex", gap: 18, alignItems: "flex-start" }}>
                <nav className="no-print" style={{ width: 230, flexShrink: 0, position: "sticky", top: 168, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 16, padding: 8 }}>
                  {SECTIONS.map(([key, label, num]) => <button key={key} className="navbtn" onClick={() => setActive(key)} style={{ width: "100%", textAlign: rtl ? "right" : "left", border: "none", cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 10, marginBottom: 2, background: active === key ? C.orange : "transparent", color: active === key ? "#fff" : C.ink, fontWeight: active === key ? 800 : 600, fontSize: 13.5 }}><span style={{ fontSize: 12, opacity: .8, minWidth: 22, fontWeight: 900 }}>{num}</span>{STR[label][L]}</button>)}
                </nav>

                <main className="print-area" style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 16 }}>
                  {active === "def" && <DefSection {...ctx} />}
                  {active === "site" && <SiteSection {...ctx} />}
                  {active === "sitemap" && <SiteMapSection {...ctx} />}
                  {active === "database" && <DatabaseSection {...ctx} />}
                  {active === "objectives" && <ObjectivesSection {...ctx} />}
                  {active === "program" && <ProgramSection {...ctx} />}
                  {active === "food" && <FoodSection {...ctx} />}
                  {active === "gear" && <GearSection {...ctx} />}
                  {active === "firstaid" && <FirstAidSection {...ctx} />}
                  {active === "budget" && <BudgetSection {...ctx} />}
                  {active === "vision" && <VisionSection {...ctx} />}
                  {active === "discuss" && <DiscussSection {...ctx} />}
                  {active === "permits" && <PermitsSection {...ctx} />}
                  {active === "expenses" && <ExpensesSection {...ctx} />}
                  {active === "evalS" && <EvalSection {...ctx} />}

                  <div style={{ textAlign: "center", padding: "16px 0 8px" }}>
                    <div style={{ display: "inline-block", paddingTop: 4, color: C.credit, fontSize: 10, fontWeight: 400, letterSpacing: ".2px", opacity: .65 }}>By: VIIème Groupe — Chef Christian Nachaat</div>
                  </div>
                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
